<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>Planning des internes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f5f3ee; --card:#fffdf9; --ink:#1d1b16; --muted:#6f6a5f; --line:#e6e1d6; --soft:#efebe2;
  --accent:#3f4bb8; --accent-soft:#e6e8f8;
  --souhait:#5b4ccc; --consult:#2a9aa8; --dispo:#e3f1e8; --eviter:#f2c662; --pasgarde:#ef9a5d; --indispo:#d95757;
  --r:16px; --shadow:0 1px 2px rgba(29,27,22,.05),0 8px 24px -12px rgba(29,27,22,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:Fraunces;font-size:18px}
.brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.5;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.accent{background:var(--accent);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}

/* Tabs (bottom bar on mobile) */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:5px;background:var(--ink);border-radius:999px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
nav.tabs button{border:0;background:transparent;color:#cfc9bc;padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--bg);color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:16px}
.card h2{font-size:20px;margin-bottom:4px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.sec-head h2{font-size:26px}
.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:#28307a;font-size:14px}
.banner.warn{background:#fbecd0;color:#7a4b06}
.banner.err{background:#f8dcdc;color:#7d2323}

/* Brushes */
.brushes{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.brush{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.brush .sw{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:11px;color:#fff}
.brush.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}

/* Calendar */
.cal{margin-top:8px;user-select:none;-webkit-user-select:none}
.cal-head,.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-head div{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:6px 0;font-weight:700}
.wk-label{font-size:12px;color:var(--muted);margin:12px 2px 5px;font-weight:600}
.day{position:relative;aspect-ratio:1/1;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s,background .15s}
.day:active{transform:scale(.94)}
.day .n{font-weight:700;font-size:15px}
.day .m{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .ic{font-size:12px;line-height:1}
.day.we{background:var(--soft)}
.day.out{visibility:hidden}
.day .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.st-souhait{background:var(--souhait)!important;color:#fff;border-color:transparent!important}
.st-souhait .m{color:#dcd7ff}
.st-consult{background:var(--consult)!important;color:#fff;border-color:transparent!important}
.st-consult .m{color:rgba(255,255,255,.75)} .st-consult .dot{background:#fff}
.st-eviter{background:var(--eviter)!important;border-color:transparent!important}
.st-pas_garde{background:var(--pasgarde)!important;color:#fff;border-color:transparent!important}
.st-pas_garde .m{color:#fff3}
.st-indispo{background:var(--indispo)!important;color:#fff;border-color:transparent!important}
.st-indispo .m,.st-pas_garde .m{color:rgba(255,255,255,.75)}
.st-souhait .dot,.st-pas_garde .dot,.st-indispo .dot{background:#fff}

.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.savebar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:50%;background:#3aa76d}
.pulse.busy{background:#e3a32c;animation:pl 1s infinite} .pulse.err{background:var(--indispo)}
@keyframes pl{50%{opacity:.3}}
textarea,input[type=text],input[type=email],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}

/* Planning */
.pday{aspect-ratio:auto;min-height:68px;justify-content:flex-start;padding:6px 3px;gap:4px}
.pday .n{font-size:13px}
.gchips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.gchip{min-width:24px;height:24px;padding:0 5px;border-radius:8px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.gchip.empty{background:#f6d4d4;color:#8a2b2b}
.pday.mine-G{outline:2.5px solid var(--accent);outline-offset:-2px}
.mycode{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.c-G{background:var(--accent);color:#fff}.c-R{background:#e7e5df;color:#555}.c-S{background:#dff0e6;color:#1d4d33}.c-A{background:#f6d4d4;color:#8a2b2b}.c-OFF{background:transparent;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}

/* Overview grid */
.ov{border-collapse:separate;border-spacing:3px;font-size:12px}
.ov th{font-weight:700;padding:4px 6px;white-space:nowrap;position:sticky;top:0;background:var(--card)}
.ov td.d{white-space:nowrap;color:var(--muted);padding-right:8px;font-weight:600}
.ov td.c{width:44px;height:24px;border-radius:6px;text-align:center;background:var(--dispo);color:#fff;font-weight:700}
.ov tr.we td.d{color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.irow{display:grid;grid-template-columns:42px 1.1fr 1.6fr 110px 34px;gap:8px;align-items:center;margin-bottom:8px}
.irow input[type=color]{width:42px;height:40px;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff}
@media(max-width:620px){.irow{grid-template-columns:42px 1fr 34px}.irow .em{grid-column:1/-1}.irow .rl{grid-column:1/-1}}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:10px;cursor:pointer}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.tg{position:relative;width:46px;height:28px;flex:none}
.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;background:#d8d3c7;border-radius:999px;transition:.2s;cursor:pointer}
.tg span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+span{background:var(--accent)}
.tg input:checked+span:before{transform:translateX(18px)}
.alert{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,27,22,.38);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-height:88vh;overflow:auto}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}} @keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{max-width:420px;text-align:center}
.login h1{font-size:40px;line-height:1.05;margin:18px 0 10px}
.login .logo{width:56px;height:56px;border-radius:16px;font-size:28px;margin:0 auto}
#gbtn{display:flex;justify-content:center;margin-top:26px;min-height:44px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.btn.lg{padding:13px 22px;font-size:16px;border-radius:14px}
.btn.light{background:#fffdf9;color:var(--ink)} .btn.ghost-light{background:transparent;color:#fffdf9;border:1px solid rgba(255,255,255,.35)}
.hero{background:linear-gradient(135deg,#232149 0%,#3f4bb8 100%);color:#fffdf9;border:0}
.hero h2{font-size:26px;color:#fffdf9}
.hero-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:700}
.bar.light{background:rgba(255,255,255,.2)} .bar.light i{background:#fffdf9}
.hero-alerts{margin-top:16px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 12px;max-height:220px;overflow:auto}
.hero-alerts .alert{border-color:rgba(255,255,255,.18)}
.chip.ok{background:rgba(255,255,255,.15);color:#fffdf9;margin:6px 0}
h3.sub{font-family:Manrope;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
ul.rules{margin:0;padding-left:18px;font-size:14px} ul.rules li{margin:5px 0}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow.off .rtxt{opacity:.45}
.rtxt{flex:1;font-weight:600;font-size:14px}
.rmeta{display:flex;gap:8px;align-items:center;margin-top:3px;font-weight:500;font-size:12px}
.badge{padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge.hard{background:#1d1b16;color:#fff}.badge.soft{background:var(--accent-soft);color:#28307a}.badge.note{background:var(--soft)}
.tg.sm{width:38px;height:22px}.tg.sm span:before{width:16px;height:16px}.tg.sm input:checked+span:before{transform:translateX(16px)}
.days-pick{display:flex;gap:6px;flex-wrap:wrap}
.days-pick label{cursor:pointer}.days-pick input{display:none}
.days-pick span{display:block;padding:8px 11px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px}
.days-pick input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.grid3{grid-template-columns:1fr}}
.wk-label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.salle-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#1d4d33;background:#dff0e6;padding:2px 9px 2px 6px;border-radius:999px}
.salle-tag i{width:10px;height:10px;border-radius:50%}
.salle-tag.me{outline:2px solid #2f9e75}
.tt{font-size:9px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.rp-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#e3a32c;display:inline-block}
.legend .rp-dot{position:static}
.c-SG,.c-CG{background:var(--accent);color:#fff}.c-L{background:transparent;color:var(--muted)}

.ovw{padding:14px}
.ow{padding:12px 0;border-bottom:1px solid var(--line)} .ow:last-child{border-bottom:0}
.ow-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ow-t{font-weight:700;font-size:13px;color:var(--muted)}
.salle-big{display:inline-flex;align-items:center;gap:8px;background:#dff0e6;color:#1d4d33;border-radius:12px;padding:5px 12px 5px 6px;font-weight:700;font-size:14px}
.salle-big small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;line-height:1}
.salle-big.me{outline:2px solid #2f9e75}
table.owt{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.owt th{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:2px 0;text-align:center}
.owt th b{font-size:13px;color:var(--ink)} .owt th:first-child{width:86px}
.owt th.we{color:var(--ink)}
.owt td{text-align:center;padding:0;height:32px;border-radius:8px;background:var(--card);cursor:pointer}
.owt td.we{background:var(--soft)}
.owt td.who{text-align:left;cursor:default;background:transparent;white-space:nowrap;overflow:hidden}
.owt .who{display:table-cell}.owt .who .avatar{display:inline-grid;vertical-align:middle;margin-right:6px}
.owt .nm{font-size:13px;font-weight:600;vertical-align:middle}
.owt tr.mine .nm{color:var(--accent)} .owt tr.mine td.who .avatar{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.oc{display:flex;align-items:center;justify-content:center;height:100%;border-radius:8px;font-size:11px;font-weight:700}
.oc.c-L{background:transparent}
.c-C,.c-CG.x{background:#d5eef2;color:#155e6b}
@media(max-width:480px){.ovw{padding:12px 8px}.owt{border-spacing:2px}.owt th:first-child{width:24px}.owt .nm{display:none}.oc{font-size:9.5px}}

.mc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-nav b{font-family:Fraunces,Georgia,serif;font-size:19px}
.mc-nav .x[disabled]{opacity:.3}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc-h div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.mc-d{min-height:58px;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.mc-d.we{background:var(--soft)} .mc-d.out{visibility:hidden} .mc-d.hors{opacity:.35}
.mc-d.has{border-color:#e9b3b3;background:#fdf1f1}
.mc-n{font-size:12px;font-weight:700}
.mc-c{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.mc-c span{min-width:19px;height:17px;padding:0 3px;border-radius:5px;color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center}
.mc-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mc-list div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.invite{display:flex;gap:8px;margin-bottom:6px} .invite input{flex:1;font-size:13px}
</style>
</head>

<div id="app"><div class="spin"></div></div>

<script>
/* ================= CONFIGURATION (à remplir) ================= */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyagsfFyMMgkWgX8f71hNgWC0fd9u9-gEbOAHXjot40WCcDlg8-94wrhtxiKXqDMQtUkA/exec',    // URL de l'application web Apps Script (…/exec)
  CLIENT_ID: '999636070129-q3bavdsod688k4v6tms41b9et6h9trcf.apps.googleusercontent.com'   // ID client OAuth Google (…apps.googleusercontent.com)
};
/* ============================================================= */
const DEMO = !CONFIG.API_URL || !CONFIG.CLIENT_ID;
</script>
<script>
// ===== MOTEUR DE PLANNING — partagé entre l'interface (mode démo) et Apps Script =====
// Règles de base :
//  • Lundi → vendredi (hors férié) : 1 garde de nuit + 1 interne de salle (le même du lundi au vendredi).
//  • Samedi : 24 h par un seul interne = astreinte (matin) + demi-garde (après-midi) + garde (nuit).
//  • Dimanche et jours fériés : 24 h par un seul interne = garde de jour + garde de nuit.
//  • Repos de sécurité le lendemain de toute garde.
//  • Règles spécifiques (par interne ou pour tous) ajoutées par l'administrateur.
var Engine = (function () {
  var JOUR = 864e5;
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parse(s) { var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function iso(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(s, n) { return iso(parse(s) + n * JOUR); }
  function listDays(a, b) { var out = []; for (var t = parse(a); t <= parse(b); t += JOUR) out.push(iso(t)); return out; }
  function dow(s) { return new Date(parse(s)).getUTCDay(); } // 0 = dimanche
  function lundi(s) { return addDays(s, -((dow(s) + 6) % 7)); }
  function feries(cfg) { return String(cfg.feries || '').split(/[,;\s]+/).filter(Boolean); }
  function isWE(s, fer) { var d = dow(s); return d === 0 || d === 6 || fer.indexOf(s) >= 0; }
  function dayType(s, fer) { var w = dow(s); if (w === 0 || fer.indexOf(s) >= 0) return 'dimanche'; if (w === 6) return 'samedi'; return 'nuit'; }
  function isSalleDay(s, fer) { var w = dow(s); return w >= 1 && w <= 5 && fer.indexOf(s) < 0; }
  function poids(cfg, t) {
    var v = parseFloat(t === 'nuit' ? cfg.poidsNuit : t === 'samedi' ? cfg.poidsSamedi : cfg.poidsDimanche);
    return isNaN(v) ? (t === 'nuit' ? 1 : 2) : v;
  }
  function rng(seed) {
    return function () {

    });

  <div class="card"><h2>Avancement des saisies</h2>
    <div class="scroll"><table class="t"><tr><th>Interne</th><th>Jours renseignés</th><th>Souhaits</th><th>Absences</th><th>Dernière modif.</th></tr>
    ${ov.internes.map(i => { const s = ov.saisies[i.email] || {}, vals = Object.values(s);
      const k = t => vals.filter(v => v.s === t).length, m = ov.maj[i.email];
      return `<tr><td><div class="row"><span class="avatar" style="width:22px;height:22px;font-size:10px;background:${esc(i.couleur)}">${esc(initials(i.nom))}</span>${esc(i.nom)}</div></td>
      <td>${vals.length}</td><td>${k('souhait')}</td><td>${k('indispo')}</td><td class="muted small">${m ? new Date(m).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '<span style="color:var(--indispo)">jamais</span>'}</td></tr>`; }).join('')}
    </table></div>
    ${Object.entries(ov.notes || {}).filter(([, n]) => n).map(([e, n]) => `<div class="alert"><b>${esc(nomDe(e))}</b><span>${esc(n)}</span></div>`).join('')}
  </div>

  <div class="card"><h2>Paramètres</h2>
    <div class="grid2" style="margin-top:10px">
      <div><label class="f">Titre</label><input type="text" id="c_titre" value="${esc(c.titre)}"></div>
      <div><label class="f">Date limite de saisie</label><input type="date" id="c_dateLimite" value="${esc(c.dateLimite)}"></div>
      <div><label class="f">Début (lundi)</label><input type="date" id="c_debut" value="${esc(c.debut)}"></div>
      <div><label class="f">Fin (dimanche)</label><input type="date" id="c_fin" value="${esc(c.fin)}"></div>
      <div style="grid-column:1/-1"><label class="f">Jours fériés (gérés comme un dimanche : 24 h, pas de salle)</label><input type="text" id="c_feries" value="${esc(c.feries)}" placeholder="2027-03-29, 2027-05-01"></div>
    </div>
    <label class="f" style="margin-top:12px">Poids pour l'équilibre de la charge</label>
    <div class="grid3">
      <div><span class="small muted">Nuit de semaine</span><input type="number" step="0.5" min="0" id="c_poidsNuit" value="${esc(c.poidsNuit)}"></div>
      <div><span class="small muted">Samedi 24 h</span><input type="number" step="0.5" min="0" id="c_poidsSamedi" value="${esc(c.poidsSamedi)}"></div>
      <div><span class="small muted">Dimanche / férié 24 h</span><input type="number" step="0.5" min="0" id="c_poidsDimanche" value="${esc(c.poidsDimanche)}"></div>
    </div>
    <label class="f" style="margin-top:12px">Ce que chaque interne voit des souhaits des autres</label>
    <select id="c_visibilite">${[['non', 'Rien'], ['absences', 'Les absences uniquement (« Ne pas travailler »)'], ['tout', 'Tous les souhaits (sans les commentaires)']].map(([v, l]) => `<option value="${v}" ${(c.visibilite || 'absences') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <div style="margin-top:10px">
      ${[['verrou', 'Verrouiller les saisies des internes'], ['publie', 'Publier le planning aux internes']].map(([k, l]) => `
      <div class="switch"><span>${l}</span><label class="tg"><input type="checkbox" id="c_${k}" ${c[k] === 'oui' ? 'checked' : ''}><span></span></label></div>`).join('')}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="savecfg">Enregistrer les paramètres</button></div>
  </div>

  <div class="card"><h2>Internes</h2>
    <h3 class="sub">Lien d'invitation</h3>
    <p class="muted small" style="margin:0 0 8px">Envoie ce lien aux internes. Ils se connectent avec leur compte Google et sont ajoutés automatiquement à la liste. Sans ce lien, personne ne peut entrer.</p>
    <div class="invite"><input type="text" readonly id="invlink" value="${esc(inviteLink(c.codeInvitation))}"><button class="btn" id="copyinv">Copier</button></div>
    <div class="switch"><span>Inscription par lien activée</span><label class="tg"><input type="checkbox" id="c_inscriptionLien" ${c.inscriptionLien !== 'non' ? 'checked' : ''}><span></span></label></div>
    <button class="btn ghost sm" id="newinv" style="margin-top:8px">Générer un nouveau lien (l'ancien ne marchera plus)</button>
    <h3 class="sub" style="margin-top:18px">Liste</h3>
    <p class="muted small" style="margin:0 0 12px">Les internes inscrits apparaissent ici. Tu peux corriger un prénom, changer une couleur ou retirer quelqu'un.</p>
    <div id="ilist">${ov.internes.map(irow).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn soft sm" id="addi">+ Ajouter</button><button class="btn" id="savei">Enregistrer la liste</button></div>
  </div>

  <div class="card"><h2>Absences — mois par mois</h2><div id="mc-admin" style="margin-top:8px"></div></div>

  <div class="card"><h2>Vue d'ensemble des souhaits</h2>
    <div class="legend">${Object.entries(STATUTS).map(([k, v]) => `<span><span style="width:12px;height:12px;border-radius:3px;background:${v.color};display:inline-block"></span>${v.short}</span>`).join('')}</div>
    <div class="scroll" style="max-height:520px;margin-top:10px"><table class="ov"><tr><th></th>${ov.internes.map(i => `<th>${esc(initials(i.nom))}</th>`).join('')}</tr>
    ${days.map(d => `<tr class="${Engine.isWE(d, F) ? 'we' : ''}"><td class="d">${dlabel(d)}</td>${ov.internes.map(i => { const v = (ov.saisies[i.email] || {})[d]; const s = v ? v.s : 'dispo';
      return `<td class="c" style="background:${STATUTS[s].color}" title="${esc(i.nom)} — ${STATUTS[s].label}${v && v.c ? ' : ' + esc(v.c) : ''}">${STATUTS[s].icon}${v && v.c ? '•' : ''}</td>`; }).join('')}</tr>`).join('')}
    </table></div>
  </div>`;

  $('#gen').onclick = () => p ? confirmModal('Relancer le calcul ? Les modifications manuelles seront écrasées.', () => lancer($('#gen'))) : lancer($('#gen'));
  if ($('#see')) $('#see').onclick = () => { S.tab = 'planning'; render(); };
  if ($('#reset')) $('#reset').onclick = async () => { await Mock.call('reset'); location.reload(); };
  $('#c_gardeApresSalle').onchange = e => saveCfg({ gardeApresSalle: e.target.checked ? 'oui' : 'non' });
  $('#c_consultActif').onchange = e => saveCfg({ consultActif: e.target.checked ? 'oui' : 'non' });
  ['consultMin', 'consultParJour'].forEach(k => $('#c_' + k).onchange = e => saveCfg({ [k]: e.target.value }));
  $('#addr').onclick = () => ruleModal();
  $('#rlist').onclick = e => {
    const row = e.target.closest('[data-r]'); if (!row) return; const k = +row.dataset.r;
    if (e.target.closest('.del')) confirmModal('Supprimer cette règle ?', () => { S.regles.splice(k, 1); saveRegles(); });
    else if (e.target.closest('.edit')) ruleModal(k);
  };
  $('#rlist').onchange = e => { const row = e.target.closest('[data-r]'); if (row && e.target.matches('.act')) { S.regles[+row.dataset.r].actif = e.target.checked; saveRegles(); } };
  $('#savecfg').onclick = () => {
    const d = {}; ['titre', 'dateLimite', 'debut', 'fin', 'feries', 'poidsNuit', 'poidsSamedi', 'poidsDimanche', 'visibilite'].forEach(k => d[k] = $('#c_' + k).value);
    ['verrou', 'publie'].forEach(k => d[k] = $('#c_' + k).checked ? 'oui' : 'non');
    saveCfg(d, true);
  };
  monthCal('mc-admin', () => S.ov.saisies, S.ov.internes);
  $('#copyinv').onclick = async () => { const v = $('#invlink').value; try { await navigator.clipboard.writeText(v); } catch (e) { $('#invlink').select(); try { document.execCommand('copy'); } catch (e2) {} } toast('Lien copié'); };
  $('#c_inscriptionLien').onchange = e => saveCfg({ inscriptionLien: e.target.checked ? 'oui' : 'non' });
  $('#newinv').onclick = () => confirmModal('Générer un nouveau lien ? L\'ancien ne permettra plus de s\'inscrire (les internes déjà inscrits gardent leur accès).', async () => {
    try { const c2 = await api('adminNouveauLien'); S.config = c2; S.ov.config = c2; $('#invlink').value = inviteLink(c2.codeInvitation); toast('Nouveau lien créé'); } catch (e) { toast(e.message); } });
  $('#addi').onclick = () => $('#ilist').insertAdjacentHTML('beforeend', irow({ email: '', nom: '', role: 'interne', couleur: ['#d1495b', '#2f9e75', '#e08e1b', '#8a5cc7', '#1f8fb4', '#b5527a'][Math.floor(Math.random() * 6)] }));
  $('#ilist').onclick = e => { if (e.target.closest('.x')) e.target.closest('.irow').remove(); };
  $('#savei').onclick = async () => {
    const list = [...document.querySelectorAll('.irow')].map(r => ({ couleur: $('[name=couleur]', r).value, nom: $('[name=nom]', r).value.trim(), email: $('[name=email]', r).value.trim().toLowerCase(), role: $('[name=role]', r).value }));
    try { S.internes = await api('adminSaveInternes', { internes: list }); toast('Liste enregistrée'); renderAdmin(); } catch (e) { toast(e.message); }
  };
}
async function saveCfg(d, rerender) {
  try { S.config = await api('adminSaveConfig', d); S.planning = await api('getPlanning'); toast('Paramètres enregistrés'); if (rerender) render(); } catch (e) { toast(e.message); }
}
function rulesList() {
  if (!S.regles.length) return '<p class="muted small">Aucune règle spécifique pour l\'instant. Ex. : « Lucas : au plus 5 gardes par mois », « Inès : pas de garde le mercredi », « Camille : salle la semaine du 8 mars ».</p>';
  return S.regles.map((r, k) => `<div class="rrow ${r.actif === false ? 'off' : ''}" data-r="${k}">
    <label class="tg sm"><input type="checkbox" class="act" ${r.actif !== false ? 'checked' : ''}><span></span></label>
    <div class="rtxt">${esc(Engine.decrire(r, nomDe))}<div class="rmeta"><span class="badge ${r.type === 'note' ? 'note' : r.force === 'souple' ? 'soft' : 'hard'}">${r.type === 'note' ? 'Note' : r.force === 'souple' ? 'Préférence' : 'Obligatoire'}</span><span class="muted">${esc(({ salle: 'Salle', garde: 'Gardes', consult: 'Consultations' })[Engine.RULE_TYPES[r.type].cible] || '')}</span></div></div>
    <button class="x edit" title="Modifier">✎</button><button class="x del" title="Supprimer">✕</button></div>`).join('');
}
async function saveRegles() {
  try { S.regles = await api('adminSaveRegles', { regles: S.regles }); if (S.ov) S.ov.regles = S.regles; $('#rlist').innerHTML = rulesList(); toast('Règles enregistrées'); }
  catch (e) { toast(e.message); }
}
function ruleModal(k) {
  const r = k != null ? Object.assign({}, S.regles[k]) : { type: 'max_gardes', qui: '*', n: 4, unite: 'mois', force: 'dure', actif: true, jours: [] };
  const groups = { garde: 'Gardes', salle: 'Salle', consult: 'Consultations', note: 'Autre' };
  const JS = [[1, 'Lun'], [2, 'Mar'], [3, 'Mer'], [4, 'Jeu'], [5, 'Ven'], [6, 'Sam'], [0, 'Dim']];
  const m = modal(`<h2 style="font-size:22px">${k != null ? 'Modifier la règle' : 'Nouvelle règle'}</h2>
    <div style="margin-top:12px"><label class="f">Pour qui ?</label><select id="rq"></select></div>
    <div style="margin-top:12px"><label class="f">Règle</label><select id="rt">${Object.entries(groups).map(([g, l]) => `<optgroup label="${l}">${Object.entries(Engine.RULE_TYPES).filter(([, t]) => t.cible === g).map(([id, t]) => `<option value="${id}" ${r.type === id ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div id="rf" style="margin-top:12px"></div>
    <div id="rforce" style="margin-top:14px"><label class="f">Importance</label>
      <div class="seg"><button data-v="dure">Obligatoire</button><button data-v="souple">Préférence</button></div>
      <p class="muted small" style="margin:6px 0 0">Obligatoire : jamais enfreinte (sauf impossibilité, signalée). Préférence : respectée autant que possible.</p></div>
    <div id="rprev" class="banner" style="margin-top:14px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="rok">Enregistrer</button></div>`);
  const read = () => {
    r.type = $('#rt', m).value; r.qui = $('#rq', m).value;
    if ($('#rn', m)) r.n = +$('#rn', m).value;
    if ($('#ru', m)) r.unite = $('#ru', m).value;
    if ($('#rd', m)) r.date = $('#rd', m).value;
    if ($('#rx', m)) r.texte = $('#rx', m).value;
    if ($('#rj', m)) r.jours = [...m.querySelectorAll('#rj input:checked')].map(i => +i.value);
  };
  const draw = () => {
    const t = Engine.RULE_TYPES[r.type];
    if (t.individuel && r.qui === '*') r.qui = S.internes[0].email;
    $('#rq', m).innerHTML = (t.individuel ? '' : `<option value="*" ${r.qui === '*' ? 'selected' : ''}>Tous les internes</option>`) + S.internes.map(i => `<option value="${esc(i.email)}" ${r.qui === i.email ? 'selected' : ''}>${esc(i.nom)}</option>`).join('');
    $('#rf', m).innerHTML = t.champs.map(f => f === 'n' ? `<label class="f">${r.type === 'ecart_min' ? 'Nombre de jours' : r.type === 'max_salle' ? 'Nombre de semaines' : 'Nombre de gardes'}</label><input type="number" min="0" id="rn" value="${esc(r.n != null ? r.n : 2)}" style="margin-bottom:10px">`
      : f === 'unite' ? `<label class="f">Par</label><select id="ru" style="margin-bottom:10px">${[['periode', 'Sur toute la période'], ['mois', 'Par mois'], ['semaine', 'Par semaine']].map(([v, l]) => `<option value="${v}" ${r.unite === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`
      : f === 'date' ? `<label class="f">${t.cible === 'salle' ? 'Un jour de la semaine concernée' : 'Date'}</label><input type="date" id="rd" min="${S.config.debut}" max="${S.config.fin}" value="${esc(r.date || S.config.debut)}" style="margin-bottom:10px">`
      : f === 'jours' ? `<label class="f">Jours sans garde</label><div class="days-pick" id="rj">${JS.map(([v, l]) => `<label><input type="checkbox" value="${v}" ${(r.jours || []).map(Number).includes(v) ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`
      : `<label class="f">Texte</label><textarea id="rx">${esc(r.texte || '')}</textarea>`).join('');
    $('#rforce', m).classList.toggle('hidden', r.type === 'note');
    m.querySelectorAll('#rforce .seg button').forEach(b => b.classList.toggle('on', b.dataset.v === (r.force || 'dure')));
    preview();
  };
  const preview = () => { read(); $('#rprev', m).textContent = Engine.decrire(r, nomDe); };
  $('#rt', m).onchange = () => { read(); draw(); };
  m.addEventListener('input', e => { if (e.target.id !== 'rt') preview(); });
  m.addEventListener('change', e => { if (e.target.id !== 'rt') preview(); });
  m.querySelectorAll('#rforce .seg button').forEach(b => b.onclick = () => { r.force = b.dataset.v; draw(); });
  $('#rok', m).onclick = () => {
    read();
    if (Engine.RULE_TYPES[r.type].champs.includes('jours') && !(r.jours || []).length) return toast('Choisis au moins un jour');
    if (k != null) S.regles[k] = r; else S.regles.push(r);
    m.remove(); saveRegles();
  };
  draw();
}
let confirmBox = false;
function inviteLink(code) { return location.origin + location.pathname + '#invite=' + (code || ''); }
function irow(i) {
  return `<div class="irow"><input type="color" name="couleur" value="${esc(i.couleur)}"><input type="text" name="nom" placeholder="Prénom" value="${esc(i.nom)}">
  <input class="em" type="email" name="email" placeholder="adresse@gmail.com" value="${esc(i.email)}">
  <select class="rl" name="role"><option value="interne" ${i.role !== 'admin' ? 'selected' : ''}>Interne</option><option value="admin" ${i.role === 'admin' ? 'selected' : ''}>Admin</option></select>
  <button class="x" title="Retirer">✕</button></div>`;
}

/* ----- Modales ----- */
function modal(html, after) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  document.body.appendChild(m); if (after) after(m); return m;
}
function confirmModal(msg, ok) {
  modal(`<h2 style="font-size:20px">Confirmer</h2><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="cy">Confirmer</button></div>`,
    m => $('#cy', m).onclick = () => { m.remove(); ok(); });
}

start();
if (DEMO) setTimeout(() => toast('Mode démo — données fictives stockées sur cet appareil'), 600);
</script>
</body>
</html>
